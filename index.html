<style>
/* 16:9 stage; each slide = base image (title area blanked) + title rows cropped from the original, revealed by GSAP */
:root{
  --bg:#000; --slide:#000; --chrome:#0b0b0b; --line:#262626; --fg:#f5f5f5; --muted:#8a8a8a; --accent:#E8613A;
  --ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);overflow:hidden;-webkit-font-smoothing:antialiased}
.app{height:100%;display:grid;grid-template-rows:1fr auto;padding-inline:16px;box-sizing:border-box}
.stage-wrap{display:grid;place-items:center;min-height:0;padding-block:16px 10px}
.stage{position:relative;width:min(100%, calc((100vh - 96px) * 16 / 9));aspect-ratio:16/9;max-width:100%;background:var(--slide);overflow:hidden;
  box-shadow:0 0 0 1px var(--line);touch-action:pan-y;cursor:pointer;user-select:none;-webkit-user-select:none}
.sl{position:absolute;inset:0;visibility:hidden}
.base{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;-webkit-user-drag:none;will-change:transform,opacity}
.mask,.ly{position:absolute;overflow:hidden;contain:paint}
.ly{overflow:visible;contain:none;will-change:transform,opacity}
.inner{position:absolute;inset:0;background-repeat:no-repeat;will-change:transform,opacity;backface-visibility:hidden;-webkit-backface-visibility:hidden}

.bar{display:flex;align-items:center;gap:14px;padding-block:10px 14px;max-width:calc((100vh - 96px) * 16 / 9);width:100%;margin-inline:auto;box-sizing:border-box}
.count{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.count b{color:var(--fg);font-weight:500}
.meta{min-width:0;flex:1;display:flex;flex-direction:column;gap:2px;overflow:hidden;height:36px;justify-content:center}
.chap{font-size:11px;letter-spacing:.08em;color:var(--accent);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{position:relative;height:2px;background:var(--line);flex:2;min-width:60px}
.track i{position:absolute;inset:0 auto 0 0;width:0;background:var(--accent)}
.btns{display:flex;gap:6px}
button{font:inherit;color:var(--fg);background:var(--chrome);border:1px solid var(--line);height:34px;min-width:34px;padding:0 10px;border-radius:6px;cursor:pointer;display:inline-grid;place-items:center;font-size:13px}
button:hover{border-color:#5a5a5a}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8}

.grid{position:fixed;inset:0;background:rgba(0,0,0,.97);z-index:10;overflow:auto;padding:calc(24px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px))}
.grid[hidden]{display:none}
.grid-head{max-width:1200px;margin:0 auto 18px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.grid-head h2{margin:0;font-size:16px;font-weight:700}
.grid-list{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.thumb{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:8px}
.thumb img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;box-shadow:0 0 0 1px var(--line);transition:box-shadow .2s}
.thumb:hover img,.thumb:focus-visible img,.thumb.on img{box-shadow:0 0 0 2px var(--accent)}
.thumb span{font-size:12px;color:var(--muted);display:flex;gap:8px}
.thumb span em{font-style:normal;font-family:var(--mono);color:var(--fg)}
.hint{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px}
kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--fg)}
@media (max-width:640px){.track,.hint-k{display:none}.name{font-size:13px}}
</style>
</head>

<script>

const SLIDES=[{"c":"표지","t":"청호나이스몰 고객 경험 개편 분석 및 제안","img":"assets/s01.png","base":"assets/b01.png","x":[0,1240],"rows":[[0,86,1240],[86,118,1240],[118,234,1240],[234,350,1240]],"desc":[]},{"c":"회사 소개","t":"NPLEY Way","img":"assets/s02.png","base":"assets/b02.png","x":[40,703],"rows":[[0,70,621],[70,100,701],[100,156,703],[156,206,309],[206,262,410]],"desc":[[796,204,1222,278]]},{"c":"회사 소개","t":"왜 엔플레이인가","img":"assets/s03.png","base":"assets/b03.png","x":[40,908],"rows":[[0,136,880],[136,170,841],[170,230,900],[230,292,908]],"desc":[]},{"c":"회사 소개","t":"프로젝트 레퍼런스","img":"assets/s04.png","base":"assets/b04.png","x":[40,1000],"rows":[[0,150,650],[150,176,1000],[176,232,1000]],"desc":[]},{"c":"회사 소개","t":"커머스 레퍼런스","img":"assets/s05.png","base":"assets/b05.png","x":[40,891],"rows":[[0,120,874],[120,146,877],[146,216,891]],"desc":[[890,128,1222,216]]},{"c":"제안 목표","t":"프로젝트 이해","img":"assets/s06.png","base":"assets/b06.png","x":[40,696],"rows":[[0,150,696],[150,176,468],[176,224,504],[224,272,358],[272,320,302]],"desc":[[60,336,480,456]]},{"c":"현행 진단","t":"기업 분석","img":"assets/s07.png","base":"assets/b07.png","x":[40,867],"rows":[[0,148,706],[148,176,714],[176,224,536],[224,272,867]],"desc":[[871,176,1214,266]]},{"c":"제안 목표","t":"렌탈 커머스 UX 컨설팅","img":"assets/s08.png","base":"assets/b08.png","x":[40,682],"rows":[[0,148,426],[148,176,426],[176,224,637],[224,272,682]],"desc":[[694,176,1214,266]]},{"c":"제안 개요","t":"배경 및 목적","img":"assets/s09.png","base":"assets/b09.png","x":[40,922],"rows":[[0,148,729],[148,176,751],[176,224,750],[224,272,922]],"desc":[[926,176,1214,266]]},{"c":"현행 진단","t":"핵심 과제","img":"assets/s10.png","base":"assets/b10.png","x":[40,593],"rows":[[0,148,558],[148,176,593],[176,224,591],[224,272,536]],"desc":[]},{"c":"개선 방향","t":"개편 전략","img":"assets/s11.png","base":"assets/b11.png","x":[40,1007],"rows":[[0,148,673],[148,176,700],[176,224,699],[224,272,1007]],"desc":[[1011,176,1214,266]]},{"c":"현행 진단","t":"사용자층 분석","img":"assets/s12.png","base":"assets/b12.png","x":[40,586],"rows":[[0,148,551],[148,176,586],[176,224,585],[224,272,478]],"desc":[[947,176,1214,266]]},{"c":"현행 진단","t":"고객 여정","img":"assets/s13.png","base":"assets/b13.png","x":[40,678],"rows":[[0,148,651],[148,176,678],[176,224,677],[224,272,570]],"desc":[[914,176,1214,266]]},{"c":"현행 진단","t":"제품 상세","img":"assets/s14.png","base":"assets/b14.png","x":[40,562],"rows":[[0,148,475],[148,176,513],[176,224,512],[224,272,562]],"desc":[[932,176,1214,266]]},{"c":"제안 개요","t":"구매 흐름과 개편 범위","img":"assets/s15.png","base":"assets/b15.png","x":[40,502],"rows":[[0,148,412],[148,176,434],[176,224,495],[224,272,502]],"desc":[[879,176,1214,266]]},{"c":"화면 설계","t":"핵심 플로우","img":"assets/s16.png","base":"assets/b16.png","x":[40,889],"rows":[[0,148,813],[148,176,848],[176,224,889],[224,272,561]],"desc":[[893,176,1214,266]]},{"c":"화면 설계","t":"FLOW 01 메인","img":"assets/s17.png","base":"assets/b17.png","x":[40,934],"rows":[[0,148,421],[148,176,458],[176,224,457],[224,272,934]],"desc":[[938,176,1214,266]]},{"c":"화면 설계","t":"FLOW 02 상세","img":"assets/s18.png","base":"assets/b18.png","x":[40,603],"rows":[[0,148,436],[148,176,472],[176,224,470],[224,272,603]],"desc":[[911,176,1214,266]]},{"c":"화면 설계","t":"FLOW 03 주문·계약","img":"assets/s19.png","base":"assets/b19.png","x":[40,787],"rows":[[0,148,752],[148,176,787],[176,224,785],[224,272,418]],"desc":[[932,176,1214,266]]},{"c":"현행 진단","t":"이미지 무드","img":"assets/s20.png","base":"assets/b20.png","x":[40,521],"rows":[[0,148,485],[148,176,521],[176,224,520],[224,272,486]],"desc":[[895,176,1214,266]]},{"c":"개선 방향","t":"고객 경험 아이디어","img":"assets/s21.png","base":"assets/b21.png","x":[40,962],"rows":[[0,148,374],[148,176,411],[176,224,962],[224,272,962]],"desc":[[966,176,1214,266]]},{"c":"고객 경험 아이디어","t":"IDEA 01 우리 집 맞춤 진단","img":"assets/s22.png","base":"assets/b22.png","x":[40,439],"rows":[[0,148,399],[148,176,439],[176,224,438],[224,272,434]],"desc":[[921,176,1214,266]]},{"c":"고객 경험 아이디어","t":"IDEA 02 들어갈까? 사이즈 체크","img":"assets/s23.png","base":"assets/b23.png","x":[40,486],"rows":[[0,148,258],[148,176,340],[176,224,394],[224,272,486]],"desc":[[909,176,1214,266]]},{"c":"고객 경험 아이디어","t":"IDEA 03 렌탈 요금 타임라인","img":"assets/s24.png","base":"assets/b24.png","x":[40,711],"rows":[[0,148,676],[148,176,711],[176,224,709],[224,272,458]],"desc":[[909,176,1214,266]]},{"c":"고객 경험 아이디어","t":"IDEA 04 견적 저장 · 공유","img":"assets/s25.png","base":"assets/b25.png","x":[40,520],"rows":[[0,148,485],[148,176,520],[176,224,518],[224,272,375]],"desc":[[923,176,1214,266]]},{"c":"고객 경험 아이디어","t":"IDEA 05 3줄 계약 요약","img":"assets/s26.png","base":"assets/b26.png","x":[40,723],"rows":[[0,148,688],[148,176,723],[176,224,722],[224,272,367]],"desc":[[909,176,1214,266]]},{"c":"고객 경험 아이디어","t":"IDEA 06 마이케어 허브","img":"assets/s27.png","base":"assets/b27.png","x":[40,658],"rows":[[0,148,623],[148,176,658],[176,224,657],[224,272,491]],"desc":[[928,176,1214,266]]},{"c":"수행 방안","t":"개편 범위별 제안","img":"assets/s28.png","base":"assets/b28.png","x":[40,663],"rows":[[0,148,594],[148,176,595],[176,236,663]],"desc":[]},{"c":"수행 방안","t":"범위·규모 비교","img":"assets/s29.png","base":"assets/b29.png","x":[40,655],"rows":[[0,148,518],[148,176,512],[176,236,655]],"desc":[]},{"c":"추진 일정","t":"일정(안)","img":"assets/s30.png","base":"assets/b30.png","x":[40,748],"rows":[[0,148,727],[148,176,722],[176,236,748]],"desc":[]},{"c":"운영 방안","t":"유지·운영","img":"assets/s31.png","base":"assets/b31.png","x":[40,672],"rows":[[0,148,637],[148,176,672],[176,224,671],[224,272,486]],"desc":[[963,176,1214,266]]},{"c":"회신","t":"회신","img":"assets/s32.png","base":"assets/b32.png","x":[70,1210],"rows":[],"desc":[]}];
const W=1280,H=720,$=id=>document.getElementById(id),pad=n=>String(n).padStart(2,'0');
const stage=$('stage');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const pc=(v,t)=>(v/t*100)+'%';

// crop a rectangle of the original slide image into a positioned layer
function crop(img,x0,y0,x1,y1){
  const w=x1-x0,h=y1-y0,el=document.createElement('div');
  el.className='inner';
  Object.assign(el.style,{backgroundImage:`url(${img})`,backgroundSize:`${W/w*100}% ${H/h*100}%`,
    backgroundPosition:`${w===W?0:x0/(W-w)*100}% ${h===H?0:y0/(H-h)*100}%`});
  return el;
}
function place(el,x0,y0,x1,y1){Object.assign(el.style,{left:pc(x0,W),top:pc(y0,H),width:pc(x1-x0,W),height:pc(y1-y0,H)})}

$('tot').textContent=pad(SLIDES.length);
const S=SLIDES.map((s,i)=>{
  const sec=document.createElement('section');sec.className='sl';sec.setAttribute('aria-label',`${pad(i+1)} ${s.t}`);
  const base=new Image();base.className='base';base.src=s.base;base.alt='';base.decoding='async';sec.appendChild(base);
  const [x0,x1]=s.x,single=s.rows.length===1;
  const ghost=[],eye=[],title=[],desc=[];
  s.rows.forEach(([y0,y1,rx],k)=>{
    const xe=rx||x1,m=document.createElement('div');m.className='mask';place(m,x0,y0,xe,y1);
    const inn=crop(s.img,x0,y0,xe,y1);m.appendChild(inn);sec.appendChild(m);
    (single?title:k===0?ghost:k===1?eye:title).push(inn);
  });
  s.desc.forEach(([a,b,c,d])=>{
    const l=document.createElement('div');l.className='ly';place(l,a,b,c,d);
    const inn=crop(s.img,a,b,c,d);l.appendChild(inn);sec.appendChild(l);desc.push(inn);
  });
  stage.appendChild(sec);return {sec,base,ghost,eye,title,desc};
});

let idx=-1,tl=null;
function meta(i){
  $('cur').textContent=pad(i+1);
  gsap.to('#prog',{width:((i+1)/SLIDES.length*100)+'%',duration:reduce?0:.8,ease:'power3.out'});
  const m=[$('chap'),$('name')];
  const set=()=>{$('chap').textContent=SLIDES[i].c;$('name').textContent=SLIDES[i].t;};
  if(reduce||idx<0){set();}
  else gsap.timeline().to(m,{yPercent:-60,autoAlpha:0,duration:.22,ease:'power2.in',stagger:.03,onComplete:set})
    .fromTo(m,{yPercent:60},{yPercent:0,autoAlpha:1,duration:.5,ease:'power3.out',stagger:.05});
  try{history.replaceState(null,'','#s'+(i+1))}catch(e){}
  document.querySelectorAll('.thumb').forEach((t,k)=>t.classList.toggle('on',k===i));
}

// enter: base settles, ghost word drifts in, eyebrow lifts, headline lines rise out of their masks, side copy follows
function enter(s,dir,at,t){
  t.set(s.sec,{visibility:'visible',zIndex:2},at)
   .set(s.title,{yPercent:dir>0?105:-105,autoAlpha:0},at)
   .fromTo(s.base,{autoAlpha:0,scale:1.02},{autoAlpha:1,scale:1,duration:1.0,ease:'power2.out'},at)
   .fromTo(s.ghost,{autoAlpha:0,xPercent:4*dir,yPercent:12},{autoAlpha:1,xPercent:0,yPercent:0,duration:1.3,ease:'power3.out',stagger:.06},at+.05)
   .fromTo(s.eye,{autoAlpha:0,yPercent:60},{autoAlpha:1,yPercent:0,duration:.7,ease:'power3.out'},at+.18)
   .to(s.title,{yPercent:0,autoAlpha:1,duration:.95,ease:'expo.out',stagger:.09},at+.26)
   .fromTo(s.desc,{autoAlpha:0,y:'1.2vh'},{autoAlpha:1,y:0,duration:.8,ease:'power3.out',stagger:.06},at+.5);
}
function leave(s,dir,t){
  t.set(s.sec,{zIndex:1},0)
   .to(s.title,{yPercent:dir>0?-105:105,autoAlpha:0,duration:.4,ease:'power2.in',stagger:.04},0)
   .to([...s.eye,...s.desc],{autoAlpha:0,y:'-1vh',duration:.3,ease:'power2.in'},0)
   .to(s.ghost,{autoAlpha:0,xPercent:-3*dir,duration:.45,ease:'power2.in'},0)
   .to(s.base,{autoAlpha:0,scale:.99,duration:.5,ease:'power2.inOut'},.1)
   .set(s.sec,{visibility:'hidden'})
   .set([s.base,...s.ghost,...s.eye,...s.desc,...s.title],{clearProps:'transform,opacity,visibility'});
}
function go(to){
  if(to<0||to>=SLIDES.length||to===idx)return;
  if(tl&&tl.isActive())tl.progress(1);
  const dir=to>idx?1:-1,from=idx;
  meta(to);idx=to;
  if(reduce){
    if(from>=0)gsap.set(S[from].sec,{visibility:'hidden'});
    gsap.set(S[to].sec,{visibility:'visible'});
    gsap.fromTo(S[to].sec,{autoAlpha:0},{autoAlpha:1,duration:.3});return;
  }
  tl=gsap.timeline();
  let at=0;
  if(from>=0){leave(S[from],dir,tl);at=.38;}
  enter(S[to],dir,at,tl);
}

const h=parseInt((location.hash||'').replace('#s',''),10);
go(h>=1&&h<=SLIDES.length?h-1:0);

$('next').onclick=()=>go(idx+1);$('prev').onclick=()=>go(idx-1);
stage.addEventListener('click',e=>{const r=stage.getBoundingClientRect();go(e.clientX-r.left<r.width*.3?idx-1:idx+1)});
let sx=null;
stage.addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});
stage.addEventListener('touchend',e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>40)go(dx<0?idx+1:idx-1);sx=null},{passive:true});

const grid=$('grid'),list=$('gridList');
SLIDES.forEach((s,i)=>{const b=document.createElement('button');b.className='thumb';b.type='button';
  b.innerHTML=`<img alt="" loading="lazy" src="${s.img}"><span><em>${pad(i+1)}</em>${s.t}</span>`;
  b.onclick=()=>{closeGrid();setTimeout(()=>go(i),reduce?0:200)};list.appendChild(b);});
function openGrid(){grid.hidden=false;document.querySelectorAll('.thumb').forEach((t,k)=>t.classList.toggle('on',k===idx));
  if(!reduce)gsap.from('.thumb',{y:16,autoAlpha:0,stagger:.03,duration:.45,ease:'power3.out'});list.children[idx]?.focus()}
function closeGrid(){grid.hidden=true;stage.focus()}
$('gridBtn').onclick=openGrid;$('gridClose').onclick=closeGrid;
$('fsBtn').onclick=()=>{if(document.fullscreenElement){document.exitFullscreen?.().catch(()=>{})}else{document.documentElement.requestFullscreen?.().catch(()=>{})}};

addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;const k=e.key;
  if(!grid.hidden){if(k==='Escape'||k==='g'||k==='G'){e.preventDefault();closeGrid()}return}
  if(['ArrowRight','ArrowDown','PageDown',' ','Enter'].includes(k)){e.preventDefault();go(idx+1)}
  else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(k)){e.preventDefault();go(idx-1)}
  else if(k==='Home')go(0);else if(k==='End')go(SLIDES.length-1);
  else if(k==='g'||k==='G')openGrid();else if(k==='f'||k==='F')$('fsBtn').click();
});
</script>
</body>
</html>
